<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dünýäden | Daşary ýurtlardan önüm sargyt</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#fff;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:20;
}

.top{
  max-width:1200px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:27px;
  font-weight:900;
  color:#ff6a00;
  white-space:nowrap;
}

.logo span{
  color:#222;
}

.search{
  flex:1;
  display:flex;
  height:46px;
  border:2px solid #ff6a00;
  border-radius:5px;
  overflow:hidden;
  background:#fff;
}

.search input{
  flex:1;
  border:0;
  outline:0;
  padding:0 15px;
  font-size:15px;
}

.search button{
  border:0;
  background:#ff6a00;
  color:white;
  padding:0 22px;
  font-size:16px;
  font-weight:bold;
}

.cartBtn{
  border:0;
  background:#fff3eb;
  color:#ff6a00;
  padding:12px 15px;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.nav{
  background:#ff6a00;
  color:white;
}

.navin{
  max-width:1200px;
  margin:auto;
  padding:10px 16px;
  display:flex;
  gap:25px;
  font-size:14px;

.hero{

  background:linear-gradient(120deg,#fff3e8,#fff);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.hero h1{
  margin:0 0 10px;
  font-size:34px;
}

.hero p{
  color:#666;
  font-size:16px;
}

.hero button{

  border:0;
  color:white;

.container{

.categories{

  margin:10px 0 15px;
}

.title h2{
  margin:0;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:#fff;
  border-radius:7px;
  overflow:hidden;
  border:1px solid #e5e5e5;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 5px 18px #0001;
}

.photo{
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fafafa;
  font-size:70px;
}

.info{
  padding:14px;
}

.name{
  height:42px;
  font-weight:bold;
  line-height:21px;
}

.price{
  color:#e65100;
  font-size:21px;
  font-weight:900;
  margin:10px 0 4px;
}

.country{
  font-size:12px;
  color:#777;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.actions button{
  flex:1;
  padding:10px 5px;
  border-radius:4px;
  cursor:pointer;
  font-weight:bold;
}

.add{
  background:#fff;
  border:1px solid #ff6a00;
  color:#ff6a00;
}

.order{
  background:#ff6a00;
  border:1px solid #ff6a00;
  color:white;
}

.empty{
  text-align:center;
  padding:50px;
  color:#777;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
}

.modal{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(430px,95%);
  background:white;
  padding:20px;
  overflow:auto;
}

.modal h2{
  margin-top:0;
}

.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:20px;
}

.cartItem{
  padding:13px 0;
  border-bottom:1px solid #ddd;
}

.share{
  width:100%;
  padding:15px;
  border:0;
  background:#20a65a;
  color:white;
  font-size:16px;
  font-weight:bold;
  border-radius:5px;
  margin-top:20px;
}

footer{
  background:#222;
  color:#aaa;
  text-align:center;
  padding:30px 15px;
  margin-top:30px;
}

@media(max-width:850px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:27px;
  }

  .logo{
    font-size:21px;
  }

  .top{
    flex-wrap:wrap;
  }

  .search{
    order:3;
    flex-basis:100%;
  }
}

@media(max-width:500px){
  .products{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .photo{
    height:145px;
  }

  .info{
    padding:9px;
  }

  .name{
    font-size:13px;
  }

  .price{
    font-size:18px;
  }

  .hero{
    padding:25px 18px;
  }
}
</style>
</head>
